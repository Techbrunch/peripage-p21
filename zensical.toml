[project]
site_name = "PeriPage P21"
site_description = "Reverse-engineering the PeriPage P21 protocol, and two clean-room clients for it"
site_url = "https://peripage-p21.pages.dev/"
repo_url = "https://github.com/Techbrunch/peripage-p21"
repo_name = "Techbrunch/peripage-p21"
edit_uri = "edit/main/docs/"

# docs_dir defaults to "docs", site_dir to "site".

nav = [
  { "Overview" = "README.md" },
  { "Setup & recon" = "00-setup-and-recon.md" },
  { "Architecture" = "01-architecture.md" },
  { "Protocol" = "02-protocol.md" },
  { "P21 flow" = "03-p21-flow.md" },
  { "Hardware validation" = "04-hardware-validation.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
